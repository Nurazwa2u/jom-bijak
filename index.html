<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Jom Bijak — kuiz Matematik untuk anak-anak.">
  <title>Jom Bijak! | Kuiz Matematik</title>
  <style>
    :root{--ink:#172b4d;--purple:#7457e8;--yellow:#ffc94a;--mint:#46d6ba;--paper:#fffdf8;--pink:#ff7f9e}*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:ui-rounded,"Nunito",system-ui,sans-serif;background:linear-gradient(145deg,#fbf7ff,#edfff9);min-height:100vh}button{font:inherit;cursor:pointer;border:0}.app{max-width:980px;margin:auto;padding:28px 20px 50px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}.brand{font-size:clamp(1.65rem,5vw,2.5rem);font-weight:900;letter-spacing:-1px}.brand span{color:var(--purple)}.badge{background:#fff;padding:9px 13px;border-radius:999px;font-weight:800;box-shadow:0 6px 20px #523f8c14}.hero{text-align:center;padding:18px 0 26px}.hero h1{font-size:clamp(2rem,6vw,3.4rem);line-height:1.05;margin:0 0 12px}.hero p{font-size:1.12rem;margin:0;color:#52637c}.profiles{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.profile{background:var(--paper);text-align:left;padding:22px;border-radius:25px;box-shadow:0 12px 28px #503b8714;transition:.2s;border:3px solid transparent}.profile:hover,.profile:focus-visible{transform:translateY(-5px);border-color:var(--purple)}.avatar{font-size:3.4rem;display:block;margin-bottom:8px}.profile h2{margin:0;font-size:1.45rem}.profile p{margin:6px 0 0;color:#65758c;font-weight:600}.progress{background:#fff;border-radius:25px;padding:22px;margin-top:22px;box-shadow:0 12px 28px #503b8710}.progress h2{margin:0 0 13px}.row{display:flex;align-items:center;gap:12px;margin:11px 0;font-weight:700}.bar{height:12px;border-radius:50px;background:#e9e9f5;flex:1;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,var(--mint),#7de2cd);border-radius:inherit}.quiz{max-width:680px;margin:12px auto}.quiz-top{display:flex;justify-content:space-between;align-items:center;font-weight:800;margin-bottom:18px}.pill{padding:8px 12px;border-radius:99px;background:#fff}.card{background:var(--paper);padding:clamp(24px,6vw,46px);border-radius:32px;box-shadow:0 16px 38px #503b8720;text-align:center}.topic{color:var(--purple);font-size:.9rem;font-weight:900;letter-spacing:1.4px;text-transform:uppercase}.question{font-size:clamp(2rem,9vw,4rem);font-weight:900;margin:20px 0 30px}.answers{display:grid;grid-template-columns:1fr 1fr;gap:13px}.answer{padding:17px;background:#f4f1ff;border-radius:18px;font-size:1.3rem;font-weight:900;color:var(--ink);transition:.15s}.answer:hover{background:#e5defe;transform:scale(1.02)}.answer.correct{background:#bdf3e5}.answer.wrong{background:#ffd7df}.feedback{font-weight:800;font-size:1.2rem;margin:19px 0 0;min-height:30px}.next{display:none;margin:20px auto 0;padding:14px 26px;border-radius:15px;background:var(--purple);color:#fff;font-weight:900}.end{padding:30px;text-align:center}.stars{font-size:3rem;letter-spacing:5px}.restart{padding:14px 23px;border-radius:15px;background:var(--purple);color:white;font-weight:900;margin:18px 5px 0}.home{background:#fff;color:var(--purple);border:2px solid var(--purple)}.hidden{display:none}@media(max-width:620px){.profiles{grid-template-columns:1fr}.top{align-items:flex-start}.answers{grid-template-columns:1fr}.profile{display:grid;grid-template-columns:75px 1fr;align-items:center}.avatar{margin:0}.app{padding:20px 15px}}
  </style>
</head>
<body><main class="app">
  <header class="top"><div class="brand">Jom <span>Bijak!</span></div><div class="badge">⭐ Belajar sambil bermain</div></header>
  <section id="home"><div class="hero"><h1>Hai, siapa nak bermain hari ini? 👋</h1><p>Pilih profil kamu dan jawab kuiz Matematik. Setiap jawapan betul dapat bintang!</p></div>
  <div class="profiles">
    <button class="profile" onclick="start(6)"><span class="avatar">🦁</span><span><h2>Si Cilik · 6 tahun</h2><p>Kira nombor & tambah mudah</p></span></button>
    <button class="profile" onclick="start(8)"><span class="avatar">🦊</span><span><h2>Si Tangkas · 8 tahun</h2><p>Tambah, tolak & darab</p></span></button>
    <button class="profile" onclick="start(11)"><span class="avatar">🦉</span><span><h2>Si Bijak · 11 tahun</h2><p>Darab, bahagi & pecahan</p></span></button>
  </div>
  <section class="progress"><h2>🏆 Kemajuan keluarga</h2><div class="row">Si Cilik <div class="bar"><div class="fill" id="p6"></div></div><span id="s6">0 ⭐</span></div><div class="row">Si Tangkas <div class="bar"><div class="fill" id="p8"></div></div><span id="s8">0 ⭐</span></div><div class="row">Si Bijak <div class="bar"><div class="fill" id="p11"></div></div><span id="s11">0 ⭐</span></div></section></section>
  <section id="quiz" class="quiz hidden"><div class="quiz-top"><button class="pill" onclick="goHome()">← Kembali</button><span class="pill" id="counter">Soalan 1 / 10</span><span class="pill">⭐ <span id="score">0</span></span></div><div class="card"><div class="topic" id="level"></div><div class="question" id="question"></div><div class="answers" id="answers"></div><div class="feedback" id="feedback"></div><button class="next" id="next" onclick="nextQuestion()">Soalan seterusnya →</button></div></section>
  <section id="end" class="card end hidden"><div class="stars">⭐ ⭐ ⭐</div><h1>Hebat sangat!</h1><p id="result"></p><button class="restart" id="again">Main lagi</button><button class="restart home" onclick="goHome()">Pilih profil</button></section>
</main><script>
let age=6,index=0,score=0,questions=[];
const bank={6:[['2 + 3',5],['4 + 1',5],['7 − 2',5],['6 + 2',8],['9 − 3',6],['3 + 4',7],['8 − 1',7],['5 + 5',10],['10 − 4',6],['2 + 6',8]],8:[['12 + 8',20],['15 − 7',8],['4 × 3',12],['25 − 9',16],['6 × 5',30],['18 + 13',31],['8 × 4',32],['40 − 15',25],['7 × 6',42],['36 ÷ 4',9]],11:[['12 × 8',96],['144 ÷ 12',12],['3/4 daripada 20',15],['25 × 6',150],['180 ÷ 9',20],['7/8 daripada 32',28],['15 × 12',180],['225 ÷ 15',15],['2/5 daripada 50',20],['18 × 7',126]]};
function start(a){age=a;index=0;score=0;questions=[...bank[a]].sort(()=>Math.random()-.5);document.getElementById('home').classList.add('hidden');document.getElementById('end').classList.add('hidden');document.getElementById('quiz').classList.remove('hidden');document.getElementById('level').textContent=`Tahap ${a} tahun`;showQuestion()}
function showQuestion(){let [q,correct]=questions[index];document.getElementById('counter').textContent=`Soalan ${index+1} / ${questions.length}`;document.getElementById('score').textContent=score;document.getElementById('question').textContent=q+' = ?';document.getElementById('feedback').textContent='';document.getElementById('next').style.display='none';let vals=[correct];while(vals.length<4){let n=correct+Math.floor(Math.random()*13)-6;if(n>=0&&!vals.includes(n))vals.push(n)}vals.sort(()=>Math.random()-.5);document.getElementById('answers').innerHTML=vals.map(n=>`<button class="answer" onclick="answer(this,${n},${correct})">${n}</button>`).join('')}
function answer(btn,n,correct){if(document.querySelector('.answer:disabled'))return;document.querySelectorAll('.answer').forEach(b=>b.disabled=true);let ok=n===correct;btn.classList.add(ok?'correct':'wrong');if(!ok)[...document.querySelectorAll('.answer')].find(b=>+b.textContent===correct).classList.add('correct');if(ok)score++;document.getElementById('score').textContent=score;document.getElementById('feedback').textContent=ok?'🎉 Betul! Kamu memang hebat!':'💪 Hampir! Jawapan betul ialah '+correct+'.';document.getElementById('next').style.display='block';document.getElementById('next').textContent=index===questions.length-1?'Lihat keputusan →':'Soalan seterusnya →'}
function nextQuestion(){index++;if(index<questions.length)showQuestion();else finish()}
function finish(){document.getElementById('quiz').classList.add('hidden');document.getElementById('end').classList.remove('hidden');document.getElementById('result').textContent=`Kamu dapat ${score} daripada ${questions.length} bintang. Teruskan usaha!`;document.getElementById('again').onclick=()=>start(age);let old=+localStorage.getItem('jomBijak'+age)||0;localStorage.setItem('jomBijak'+age,Math.max(old,score));renderProgress()}
function renderProgress(){[6,8,11].forEach(a=>{let n=+localStorage.getItem('jomBijak'+a)||0;document.getElementById('s'+a).textContent=n+' ⭐';document.getElementById('p'+a).style.width=(n*10)+'%'})}function goHome(){document.getElementById('quiz').classList.add('hidden');document.getElementById('end').classList.add('hidden');document.getElementById('home').classList.remove('hidden');renderProgress()}renderProgress();
</script></body></html>
